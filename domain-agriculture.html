<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agriculture · TRAVI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* 옛 분야 페이지 자리: 이 분야의 Coop 목록으로 안내만 한다 */
.moved { max-width: 720px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.moved .dicon { width: 36px; height: 36px; border-radius: 10px; background: #f4f5f9; display: grid; place-items: center; }
.moved .dicon svg { width: 24px; height: 24px; display: block; }
.moved p { flex: 1; min-width: 200px; margin: 0; }
</style>
</head>
<body>

<header data-travi-header data-active="cooperatives"></header>

<main class="wrap tv-main">
  <div class="crumb"><a href="index.html">Home</a><span class="sep">›</span><a href="coop.html">Cooperatives</a><span class="sep">›</span><span class="cur">Agriculture</span></div>

  <div class="tv-head">
    <div>
      <h1 class="tv-h1">Agriculture</h1>
      <p class="tv-lead">No Coops yet in Agriculture.</p>
    </div>
  </div>

  <div class="tv-card moved">
    <span class="dicon" data-icon="agriculture"></span>
    <p>Every Coop is in one list on Cooperatives.</p>
    <a class="btn solid" href="coop.html?domain=agriculture">Explore Coops</a>
  </div>

  <details class="tv-review">
    <summary>Review notes <span>0 open questions</span></summary>
    <div class="tv-review-body">
      <h3>가정</h3>
      <ol>
        <li>분야별 페이지는 Cooperatives 목록의 도메인 필터로 바뀌었다. 옛 주소로 들어오는 사람을 위해 이 파일은 안내만 남긴다.</li>
        <li>코옵 상태어와 겹치지 않게 Coming soon 같은 말은 쓰지 않는다.</li>
      </ol>
    </div>
  </details>
</main>

<footer data-travi-footer></footer>

<script src="icons/domain-icons.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var el = document.querySelector('[data-icon]');
  var k = el && el.getAttribute('data-icon');
  if (el && window.TRAVI_ICONS && window.TRAVI_ICONS[k]) {
    el.innerHTML = window.TRAVI_ICONS[k];
    if (window.TRAVI_ICON_COLORS) el.style.color = window.TRAVI_ICON_COLORS.light[k];
  }
})();
</script>
</body>
</html>
