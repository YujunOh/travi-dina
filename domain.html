<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domains · TRAVI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* 옛 Domain 메뉴 자리: AI Cooperatives로 옮겼다는 안내만 남긴다 */
.moved { max-width: 720px; }
.moved .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.moved .row .btn { letter-spacing: 0.02em; }
.moved .k { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--faint); }
.moved .go { margin-top: 24px; }
</style>
</head>
<body>

<header data-travi-header data-active="cooperatives"></header>

<main class="wrap tv-main">
  <div class="crumb"><a href="index.html">Home</a><span class="sep">›</span><span class="cur">AI Cooperatives</span></div>

  <div class="tv-head">
    <div>
      <h1 class="tv-h1">Domains are now on AI Cooperatives</h1>
      <p class="tv-lead">Every Coop is in one list. Filter it by domain.</p>
    </div>
  </div>

  <div class="tv-card moved">
    <p class="k">Filter by domain</p>
    <div class="row">
      <a class="btn outline" href="coop.html?domain=security">Security</a>
      <a class="btn outline" href="coop.html?domain=finance">Finance</a>
      <a class="btn outline" href="coop.html?domain=agriculture">Agriculture</a>
      <a class="btn outline" href="coop.html?domain=healthcare">Healthcare</a>
    </div>
    <div class="go"><a class="btn solid" href="coop.html">Explore Coops</a></div>
  </div>

</main>

<footer data-travi-footer></footer>

<script src="app.js"></script>
