<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in to TRAVI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* MF 05a Log in. 가입(join.html)과 나눈 로그인 화면. Google 우선, 이메일 로그인은 나중 */
[hidden] { display: none !important; }
.li-card { width: 100%; max-width: 400px; margin: 40px auto 0; padding: 32px; }
.li-card .tv-h1 { font-size: 28px; text-align: center; }
.li-card .tv-banner { margin: 18px 0 0; }
.li-card .li-err { margin: 18px 0 0; padding: 10px 12px; border: 1px solid #f2c6c2; border-radius: 10px; background: #fdf1f0; font-size: 14px; color: #b8443b; }
.li-google { width: 100%; justify-content: center; margin-top: 24px; letter-spacing: 0.02em; }
.li-or { display: flex; align-items: center; gap: 12px; margin: 24px 0 18px; font-size: 13px; color: var(--faint); }
.li-or::before, .li-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.li-card .tv-field > label { color: var(--faint); }
.li-help { display: block; margin: -4px 0 16px; }
.li-submit { width: 100%; justify-content: center; letter-spacing: 0.02em; }
.li-card .li-alt { margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 14px; color: var(--muted); }
.li-alt a { color: var(--text); font-weight: 600; text-decoration: underline; }
@media (max-width: 760px) {
  .li-card { margin-top: 24px; padding: 22px; }
}
</style>
</head>
<body>

<header data-travi-header data-active=""></header>

<main class="wrap tv-main li-main">
  <div class="crumb"><a href="index.html">Home</a><span class="sep">›</span><span class="cur">Log in</span></div>

  <section class="tv-card li-card" aria-labelledby="li-h">
    <h1 class="tv-h1" id="li-h">Log in to TRAVI</h1>

    <!-- 코옵 상세에서 Join을 누른 게스트만 보인다 (login.html?coop=soc&return=...) -->
    <div class="tv-banner" id="from-coop" hidden>Log in to send your join request to <b id="from-coop-name">SOC Threat Detection</b>. You'll return to your request afterward.</div>

    <!-- login.html?error=1 -->
    <p class="tv-err li-err" id="g-err" role="alert" hidden>We couldn't log you in with Google. Try again.</p>

    <button class="btn solid lg li-google" type="button" id="g-btn">Continue with Google</button>

    <div class="li-or"><span>or</span></div>

    <form id="email-form" onsubmit="return false" aria-describedby="email-help">
      <div class="tv-field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" disabled></div>
      <div class="tv-field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" disabled></div>
      <span class="tv-help li-help" id="email-help">Logging in with email is coming later. Use Google for now.</span>
      <button class="btn ghost li-submit" type="submit" disabled>Log in</button>
    </form>

    <p class="li-alt">New to TRAVI? <a id="to-join" href="join.html">Create an account</a></p>
  </section>

</main>

<footer data-travi-footer></footer>

<script src="app.js"></script>
<script>
(function () {
  var T = window.TRAVI;
  var q = new URLSearchParams(location.search);
  var coopId = q.get('coop');
  var coop = coopId && T.coops[coopId] && T.coops[coopId].status === 'Open to join' ? T.coops[coopId] : null;

  if (coop) {
    document.getElementById('from-coop-name').textContent = String(coop.name).replace(/ Coop$/, '');
    document.getElementById('from-coop').hidden = false;
  }
  if (q.get('error') === '1') document.getElementById('g-err').hidden = false;

  // coop과 return 값은 Create an account 링크에 그대로 넘긴다
  var keep = new URLSearchParams();
  ['coop', 'return'].forEach(function (k) { if (q.get(k)) keep.set(k, q.get(k)); });
  var ks = keep.toString();
  document.getElementById('to-join').setAttribute('href', 'join.html' + (ks ? '?' + ks : ''));

  // 시안: 누르면 회원으로 로그인한 것으로 보고 return 주소(없으면 기본값)로 간다
  document.getElementById('g-btn').addEventListener('click', function () {
    T.signIn('member', coop ? 'request.html?coop=' + encodeURIComponent(coop.id) : 'dashboard.html');
  });
})();
</script>
</body>
</html>
